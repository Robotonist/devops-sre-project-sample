---
- name: Verify Ops Appliance host
  hosts: appliance
  gather_facts: false
  become: true

  tasks:
    - name: Read opsappliance passwd entry
      ansible.builtin.getent:
        database: passwd
        key: "{{ ops_appliance_user }}"

    - name: Verify Podman package
      ansible.builtin.command: podman --version
      register: podman_version
      changed_when: false

    - name: Verify cgroup v2
      ansible.builtin.command: podman info --format "{{ '{{' }}.Host.CgroupsVersion{{ '}}' }}"
      become: true
      become_user: "{{ ops_appliance_user }}"
      register: cgroup_version
      changed_when: false

    - name: Verify linger is enabled
      ansible.builtin.command: loginctl show-user "{{ ops_appliance_user }}" -p Linger --value
      register: linger_state
      changed_when: false

    - name: Assert host runtime contract
      ansible.builtin.assert:
        that:
          - podman_version.stdout is search("podman version 5\\.")
          - cgroup_version.stdout == "v2"
          - linger_state.stdout == "yes"

    - name: Read UFW status
      ansible.builtin.command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Assert firewall policy
      ansible.builtin.assert:
        that:
          - '"Status: active" in ufw_status.stdout'
          - '"Default: deny (incoming)" in ufw_status.stdout'
          - 'ufw_status.stdout is search("22/tcp|OpenSSH")'
          - '"8000/tcp" in ufw_status.stdout'

    - name: List rootless Podman containers
      ansible.builtin.command: podman ps --format "{{ '{{' }}.Names{{ '}}' }}"
      become: true
      become_user: "{{ ops_appliance_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ops_appliance_uid }}"
      register: podman_containers
      changed_when: false

    - name: Assert data containers exist
      ansible.builtin.assert:
        that:
          - '"ops-postgres" in podman_containers.stdout_lines'
          - '"ops-redis" in podman_containers.stdout_lines'

    - name: Verify PostgreSQL readiness
      ansible.builtin.command: >
        podman exec ops-postgres
        pg_isready -U "{{ postgres_user }}" -d "{{ postgres_db }}"
      become: true
      become_user: "{{ ops_appliance_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ops_appliance_uid }}"
      changed_when: false

    - name: Verify Redis readiness
      ansible.builtin.command: podman exec ops-redis redis-cli ping
      become: true
      become_user: "{{ ops_appliance_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ops_appliance_uid }}"
      register: redis_ping
      changed_when: false
      failed_when: redis_ping.stdout != "PONG"
