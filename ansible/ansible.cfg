[defaults]
inventory = inventory/local.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True

[privilege_escalation]
# Ubuntu 26.04 defaults to sudo-rs; Ansible 2.21 requires classic sudo for password-based become.
become_exe = /usr/bin/sudo.ws
